fsm:
  flight_type: $(arg flight_type)  # 目标输入方式：1=RViz 交互目标，2=下方预设航点
  thresh_replan_time: 1.0          # 轨迹执行多久后触发周期重规划，单位：s
  planning_horizon: $(arg planning_horizon)  # 局部规划前视距离，需覆盖有效感知范围
  emergency_time: 1.0             # 碰撞检查剩余时间小于该值时进入紧急处理，单位：s
  realworld_experiment: true       # true 时等待外部轨迹触发信号后才开始规划
  fail_safe: true                  # 规划连续失败时允许进入悬停/安全恢复流程
  modify_final_goal: true          # 终点被占用时沿全局轨迹回退到安全点
  enable_stuck_detect: true        # 启用目标附近卡死检测与恢复
  waypoint_num: 1                  # flight_type=2 时生效
  waypoint0_x: 0.0
  waypoint0_y: 0.0
  waypoint0_z: 0.0
  waypoint1_x: 0.0
  waypoint1_y: 0.0
  waypoint1_z: 0.0
  waypoint2_x: 0.0
  waypoint2_y: 0.0
  waypoint2_z: 0.0
  waypoint3_x: 0.0
  waypoint3_y: 0.0
  waypoint3_z: 0.0
  waypoint4_x: 0.0
  waypoint4_y: 0.0
  waypoint4_z: 0.0

grid_map:
  resolution: 0.2                 # 栅格边长，越小地图越精细，但内存和计算量越大，单位：m
  # 地图总边界，应覆盖完整飞行区域，单位：m
  map_size_x: $(arg map_size_x)
  map_size_y: $(arg map_size_y)
  map_size_z: $(arg map_size_z)
  # 机器人周围参与实时更新的局部范围，规划视距不宜明显超过它，单位：m
  local_update_range_x: 5.5
  local_update_range_y: 5.5
  local_update_range_z: 2.0
  obstacles_inflation: 0.4        # 障碍物膨胀半径，是最直接的地图安全裕度，单位：m
  local_map_margin: 10            # 局部更新区额外保留的栅格层数
  enable_virtual_wall: false      # 是否把上下高度边界作为虚拟障碍物
  virtual_ceil: 3.0
  virtual_ground: -0.1
  ground_height: -0.01

  # 深度相机内参与滤波参数；当前 LiDAR 输入模式下通常无需调整
  cx: 321.04638671875
  cy: 243.44969177246094
  fx: 387.229248046875
  fy: 387.229248046875
  use_depth_filter: true
  depth_filter_tolerance: 0.15
  depth_filter_maxdist: 5.0
  depth_filter_mindist: 0.2
  depth_filter_margin: 2
  k_depth_scaling_factor: 1000.0
  skip_pixel: 2

  # 占据概率模型 不建议随意修改
  p_hit: 0.65
  p_miss: 0.35
  p_min: 0.12
  p_max: 0.90
  p_occ: 0.80
  lidar_p_hit: 0.9                # LiDAR 命中一次时增加占据概率的强度
  lidar_p_miss: 0.49
  lidar_p_min: 0.12
  lidar_p_max: 0.98
  lidar_p_occ: 0.85
  cloud_enable_raycast: true      # 必须开启才能沿点云射线更新自由空间
  fading_time: 1000.0             # 障碍占据随时间衰减的时间尺度，<=0 表示关闭，单位：s
  min_ray_length: 0.1
  max_ray_length: 4.5
  visualization_truncate_height: 1.9
  show_occ_time: true             # 仅调试：持续打印地图更新性能日志
  pose_type: 1                    # 位姿输入类型，需与实际 odometry 接口匹配
  frame_id: world                 # 地图、轨迹和可视化使用的全局坐标系

manager:
  max_vel: $(arg max_velocity)    # 规划器允许的最大速度，单位：m/s
  max_acc: $(arg max_acceleration)  # 规划器允许的最大加速度，单位：m/s²
  trajectory_piece_length: 1.5   # 多项式轨迹单段的目标空间长度，单位：m
  feasibility_tolerance: 0.05    # 动力学可行性检查的相对容差
  planning_horizon: $(arg planning_horizon)  # 应与 fsm/planning_horizon 保持一致
  use_multitopology_trajs: $(arg use_multi_topology_trajectories)  # 同时尝试不同绕障拓扑，效果更强但计算更重
  drone_id: 0                    # 单机固定为 0；多机运行时必须保持唯一

optimization:
  constraint_points_per_piece: 5  # 每段轨迹的离散约束点数；越大检查更密、计算更慢
  # 代价权重决定优化器的取舍；增大某项会更严格地压制对应代价
  weight_obstacle: 10000.0        # 硬障碍碰撞代价
  weight_obstacle_soft: 5000.0    # 进入软安全区后的提前避障代价
  weight_swarm: 10000.0
  weight_feasibility: 10000.0     # 超出速度、加速度和 jerk 限制的代价
  weight_sqrvariance: 10000.0
  weight_time: 10.0               # 轨迹总时间代价；越大越倾向生成更快的轨迹
  obstacle_clearance: 0.1         # 硬障碍最小净空，单位：m
  obstacle_clearance_soft: 0.5    # 开始施加软避障代价的距离，单位：m
  swarm_clearance: 0.15000000000000002  # 与其他无人机的最小净空，单位：m
  # 以下动力学上限应与 manager 中的限制保持一致
  max_vel: $(arg max_velocity)
  vel_tolerance: 1.0
  max_acc: $(arg max_acceleration)
  acc_tolerance: 1.0
  max_jer: $(arg max_jerk)
  record_opt: true                # 当前版本未读取，仅保留历史配置兼容
