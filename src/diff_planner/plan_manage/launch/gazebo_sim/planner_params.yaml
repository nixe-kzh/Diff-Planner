fsm:
  flight_type: $(arg flight_type)
  thresh_replan_time: 1.0
  planning_horizon: $(arg planning_horizon)
  emergency_time: 1.0
  realworld_experiment: true
  fail_safe: true
  modify_final_goal: true
  enable_stuck_detect: true
  waypoint_num: 1
  waypoint0_x: 0.0
  waypoint0_y: 0.0
  waypoint0_z: 0.0
  waypoint1_x: 0.0
  waypoint1_y: 0.0
  waypoint1_z: 0.0
  waypoint2_x: 0.0
  waypoint2_y: 0.0
  waypoint2_z: 0.0
  waypoint3_x: 0.0
  waypoint3_y: 0.0
  waypoint3_z: 0.0
  waypoint4_x: 0.0
  waypoint4_y: 0.0
  waypoint4_z: 0.0

grid_map:
  resolution: 0.2
  map_size_x: $(arg map_size_x)
  map_size_y: $(arg map_size_y)
  map_size_z: $(arg map_size_z)
  local_update_range_x: 5.5
  local_update_range_y: 5.5
  local_update_range_z: 2.0
  obstacles_inflation: 0.4
  local_map_margin: 10
  enable_virtual_wall: false
  virtual_ceil: 3.0
  virtual_ground: -0.1
  ground_height: -0.01

  cx: 321.04638671875
  cy: 243.44969177246094
  fx: 387.229248046875
  fy: 387.229248046875
  use_depth_filter: true
  depth_filter_tolerance: 0.15
  depth_filter_maxdist: 5.0
  depth_filter_mindist: 0.2
  depth_filter_margin: 2
  k_depth_scaling_factor: 1000.0
  skip_pixel: 2

  p_hit: 0.65
  p_miss: 0.35
  p_min: 0.12
  p_max: 0.90
  p_occ: 0.80
  lidar_p_hit: 0.9
  lidar_p_miss: 0.49
  lidar_p_min: 0.12
  lidar_p_max: 0.98
  lidar_p_occ: 0.85
  cloud_enable_raycast: true
  fading_time: 1000.0
  min_ray_length: 0.1
  max_ray_length: 4.5
  visualization_truncate_height: 1.9
  show_occ_time: true
  pose_type: 1
  frame_id: world

manager:
  max_vel: $(arg max_velocity)
  max_acc: $(arg max_acceleration)
  trajectory_piece_length: 1.5
  feasibility_tolerance: 0.05
  planning_horizon: $(arg planning_horizon)
  use_multitopology_trajs: $(arg use_multi_topology_trajectories)
  drone_id: 0

optimization:
  constraint_points_per_piece: 5
  weight_obstacle: 10000.0
  weight_obstacle_soft: 5000.0
  weight_swarm: 10000.0
  weight_feasibility: 10000.0
  weight_sqrvariance: 10000.0
  weight_time: 10.0
  obstacle_clearance: 0.1
  obstacle_clearance_soft: 0.5
  swarm_clearance: 0.15000000000000002
  max_vel: $(arg max_velocity)
  vel_tolerance: 1.0
  max_acc: $(arg max_acceleration)
  acc_tolerance: 1.0
  max_jer: $(arg max_jerk)
  record_opt: true
