fsm:
  flight_type: $(arg flight_type)  # 1=RViz 交互目标，2=下方预设航点
  thresh_replan_time: 1.0          # 周期重规划间隔，单位：s
  planning_horizon: $(arg planning_horizon)
  emergency_time: 0.8             # 真机碰撞检查的紧急时间阈值，单位：s
  realworld_experiment: true       # 等待外部 /traj_start_trigger 后开始规划
  fail_safe: true
  modify_final_goal: true
  enable_stuck_detect: true
  waypoint_num: 1
  waypoint0_x: 0.0
  waypoint0_y: 0.0
  waypoint0_z: 1.0
  waypoint1_x: 0.0
  waypoint1_y: 0.0
  waypoint1_z: 1.0
  waypoint2_x: 0.0
  waypoint2_y: 0.0
  waypoint2_z: 1.0
  waypoint3_x: 0.0
  waypoint3_y: 0.0
  waypoint3_z: 1.0
  waypoint4_x: 0.0
  waypoint4_y: 0.0
  waypoint4_z: 1.0

grid_map:
  resolution: 0.2
  # 保留与 gazebo_sim 相同的全局边界接口，便于切换大地图实现。
  map_size_x: $(arg map_size_x)
  map_size_y: $(arg map_size_y)
  map_size_z: $(arg map_size_z)
  local_update_range_x: 5.5
  local_update_range_y: 5.5
  local_update_range_z: 2.0
  obstacles_inflation: 0.4
  local_map_margin: 10
  # 真机默认限制在 0.1~2.0 m 高度内，实飞前按场地确认。
  enable_virtual_wall: true
  virtual_ceil: 2.0
  virtual_ground: 0.1
  ground_height: -0.01
  init_x: $(arg map_init_x)
  init_y: $(arg map_init_y)
  init_z: $(arg map_init_z)

  # 深度相机参数在当前 LiDAR 输入模式下不使用。
  cx: 319.31427001953125
  cy: 239.09725952148438
  fx: 386.2706298828125
  fy: 386.2706298828125
  use_depth_filter: true
  depth_filter_tolerance: 0.15
  depth_filter_maxdist: 5.0
  depth_filter_mindist: 0.2
  depth_filter_margin: 2
  k_depth_scaling_factor: 1000.0
  skip_pixel: 2

  p_hit: 0.65
  p_miss: 0.35
  p_min: 0.12
  p_max: 0.90
  p_occ: 0.80
  lidar_p_hit: 0.9
  lidar_p_miss: 0.49
  lidar_p_min: 0.12
  lidar_p_max: 0.98
  lidar_p_occ: 0.85
  cloud_enable_raycast: true
  fading_time: -1.0              # LIO 点云默认关闭障碍物时间衰减
  min_ray_length: 0.1
  max_ray_length: 4.5
  visualization_truncate_height: 1.9
  show_occ_time: false
  pose_type: 2                   # 2=nav_msgs/Odometry
  frame_id: world

manager:
  max_vel: $(arg max_velocity)
  max_acc: $(arg max_acceleration)
  trajectory_piece_length: 1.5
  feasibility_tolerance: 0.05
  planning_horizon: $(arg planning_horizon)
  use_multitopology_trajs: $(arg use_multi_topology_trajectories)
  drone_id: 0

optimization:
  constraint_points_per_piece: 5
  weight_obstacle: 10000.0
  weight_obstacle_soft: 5000.0
  weight_swarm: 10000.0
  weight_feasibility: 10000.0
  weight_sqrvariance: 10000.0
  weight_time: 10.0
  obstacle_clearance: 0.1
  obstacle_clearance_soft: 0.5
  swarm_clearance: 0.15000000000000002
  max_vel: $(arg max_velocity)
  vel_tolerance: 1.0
  max_acc: $(arg max_acceleration)
  acc_tolerance: 1.0
  max_jer: $(arg max_jerk)
  record_opt: true
